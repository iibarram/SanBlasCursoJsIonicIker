<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        let numDni;
        numDni = +prompt("Ingrese su número de DNI");
        calcularLetraDni(numDni);
        function calcularLetraDni(numDni){
            let letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E'];
            let letra = letras[numDni % 23];
            alert("La letra correspondiente a su DNI es: " + letra);
        }


    </script>
    <title>Document</title>
</head>
<body>
    <h1>Ejercicio 3</h1>
</body>
</html>
