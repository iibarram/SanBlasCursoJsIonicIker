<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        let numero1;
        let numero2;
        let resultado;
        function pedirNumero(){
                    numero = prompt("Introduce un número:");
                    while(numero === null || numero.trim() === "" || isNaN(numero)) {
                        numero = prompt("Numero incorrecto, introduzca un numero correcto:")
                    }
                return numero;
            }
        function calcularNumeroMinimo(num1, num2){
            if (num1<num2){
                return alert(`El número ${num1} es menor a ${num2}`);
            }
            else if(num1==num2){
                return alert(`El número ${num1} es igual a ${num2}`);
            }
            else{
                return alert(`El número ${num2} es menor a ${num1}`);
            }
        }
        numero1=pedirNumero();
        numero2=pedirNumero();
        resultado=calcularNumeroMinimo(numero1, numero2);
        
    </script>
    <title>Document</title>
</head>
<body>
    <h1>Ejercicio 10</h1>
</body>
</html>
